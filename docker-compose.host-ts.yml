# tailnetDash on a host that already runs Tailscale: published only on the host's tailnet
# address. Use with a .env made from .env.host-ts.example:
#   docker compose -f docker-compose.host-ts.yml up -d
services:
  ts-dash:
    # Published image; TS_DASH_TAG picks the version ("1" follows 1.x releases).
    image: ghcr.io/larryni/ts-dash:${TS_DASH_TAG:-1}
    container_name: ts-dash
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container; PORT in .env only changes the published host port.
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/dashboard.db
    ports:
      # Publish on the host's tailnet address only, never on the public interface.
      - "${BIND_IP:?set BIND_IP in .env to this machine's tailnet IP (tailscale ip -4)}:${PORT:-8080}:8080"
    volumes:
      - ts-dash-data:/data

volumes:
  ts-dash-data:
