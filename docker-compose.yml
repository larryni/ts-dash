# tailnetDash with its own Tailscale sidecar. It joins your tailnet as its own machine (called
# "ts-dash" unless you set TS_HOSTNAME) and is served over HTTPS at
# https://<hostname>.<your-tailnet>.ts.net. No ports are published on the host.
#
# Everything needed is in this file plus a .env next to it (see .env.example):
#   docker compose up -d
#
# Requires Docker Compose 2.23.1 or newer (for the inline serve config below).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-dash-tailscale
    hostname: ${TS_HOSTNAME:-ts-dash}
    environment:
      # Only needed on the first start; the node then authenticates from ./tailscale-state.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    configs:
      - source: serve
        target: /config/serve.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ts-dash:
    # Published image. TS_DASH_TAG picks the version: "1" (default) follows 1.x releases,
    # "latest" follows every release, or pin an exact one such as "1.0.0".
    image: ghcr.io/larryni/ts-dash:${TS_DASH_TAG:-1}
    container_name: ts-dash
    # The dashboard uses the sidecar's network, so its pings and :22/:443 probes go straight
    # out over the tailnet.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Optional: the API token can be entered in the web page instead (saved to /data/api_key).
      TS_API_KEY: ${TS_API_KEY:-}
      TS_TAILNET: ${TS_TAILNET:--}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      PROBE_PORTS: ${PROBE_PORTS:-1}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-0}
      # Listen on localhost inside the shared network; Tailscale Serve is the only way in.
      HOST: 127.0.0.1
      # Tailscale Serve is the only way in, so its forwarded client address/https can be trusted.
      TRUST_PROXY: "1"
      PORT: "8080"
      DB_PATH: /data/dashboard.db
    volumes:
      - ts-dash-data:/data

# Tailscale Serve: HTTPS on :443 of the tailnet machine, forwarded to the dashboard.
# "$$" stops Compose from filling in ${TS_CERT_DOMAIN} itself; Tailscale replaces it with the
# machine's own name (e.g. ts-dash.tail1234.ts.net) when it reads the file.
configs:
  serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://127.0.0.1:8080" } }
          }
        }
      }

volumes:
  ts-dash-data:
