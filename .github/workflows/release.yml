# Builds the Docker image for amd64 and arm64 and publishes it to
# ghcr.io/larryni/ts-dash whenever a version tag (v1.2.3) is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Image tags produced:
#   v1.2.3      -> 1.2.3, 1.2, 1, latest
#   v1.2.3-rc1  -> 1.2.3-rc1 only (pre-releases never move "latest" or "1")
#   v0.x.y      -> 0.x.y and 0.x only (no "0" tag: 0.x is not stable)
name: Release image

on:
  push:
    tags: ["v*"]

# One release build at a time; a newer tag doesn't cancel one that's running.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read     # check out the code
  packages: write    # push to ghcr.io with the built-in GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ts-dash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # QEMU lets the x64 runner build the arm64 image too. The app is pure Python,
      # so emulation only slows the small pip install.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags, plus OCI labels/annotations (version, git revision, build date, source...).
      # Title and description are set here so they match the Dockerfile rather than the
      # repo name. Annotations go on the multi-arch index too: ghcr.io reads the package
      # description from there.
      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=tailnetDash
            org.opencontainers.image.description=Self-hosted dashboard for a Tailscale network: devices, uptime, latency, timeline
          annotations: |
            org.opencontainers.image.title=tailnetDash
            org.opencontainers.image.description=Self-hosted dashboard for a Tailscale network: devices, uptime, latency, timeline

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # reuse unchanged layers (base image, pip install) between releases
          cache-from: type=gha
          cache-to: type=gha,mode=max
