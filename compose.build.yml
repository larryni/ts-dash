# Build the dashboard from this source folder instead of pulling the published image.
# Layer it over either compose file:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
#   docker compose -f docker-compose.host-ts.yml -f compose.build.yml up -d --build
services:
  ts-dash:
    build: .
    image: ts-dash:local
